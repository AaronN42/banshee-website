<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BANSHEE Website Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        .hero {
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px;
        }

        .card {
            background: white;
            max-width: 850px;
            width: 100%;
            padding: 55px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.10);
        }

        h1 {
            margin-top: 0;
            font-size: 46px;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
        }

        .status {
            margin-top: 30px;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <section class="hero">
        <div class="card">
            <h1>BANSHEE UAV</h1>

            <p>
                This webpage is being hosted through GitHub Pages
                and displayed inside Google Sites.
            </p>

            <p>
                If you can see this directly inside the Google Site,
                the test worked.
            </p>

            <div class="status">
                TEST VERSION 2 — GITHUB UPDATE WORKED
            </div>
        </div>
    </section>

</body>
</html>
